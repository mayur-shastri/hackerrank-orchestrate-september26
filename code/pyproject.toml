[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buy-or-wait"
version = "0.1.0"
description = "AI-powered financial affordability agent"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "data*",
    "forecast*",
    "evaluation*",
    "world_model*",
]